name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      # Build-time only: used to pack the Arduino core archive and precompile
      # the examples. Visitors download a prebuilt WebAssembly compiler.
      - name: Install AVR toolchain (build machine only)
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-avr avr-libc binutils-avr

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - name: Prepare web-optimised WASM toolchain
        run: pnpm prepare-toolchain
      - name: Precompile examples
        run: pnpm examples
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

      - name: End-to-end tests (static build, in-browser compiler)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
